x-experimento-base: &experimento-base
  build:
    context: .
    dockerfile: Dockerfile
  image: projeto-menor-caminho:latest
  volumes:
    - ./resultados:/app/resultados

services:
  bellman-ford:
    <<: *experimento-base
    command:
      [
        "python", "main.py",
        "--algoritmo", "Bellman-Ford",
        "--tamanhos", "30", "60", "100", "150",
        "--repeticoes", "30",
        "--aquecimentos", "3",
        "--pular-testes"
      ]

  dijkstra:
    <<: *experimento-base
    command:
      [
        "python", "main.py",
        "--algoritmo", "Dijkstra",
        "--tamanhos", "30", "60", "100", "150",
        "--repeticoes", "30",
        "--aquecimentos", "3",
        "--pular-testes"
      ]

  floyd-warshall:
    <<: *experimento-base
    command:
      [
        "python", "main.py",
        "--algoritmo", "Floyd-Warshall",
        "--tamanhos", "30", "60", "100", "150",
        "--repeticoes", "30",
        "--aquecimentos", "3",
        "--pular-testes"
      ]

  johnson:
    <<: *experimento-base
    command:
      [
        "python", "main.py",
        "--algoritmo", "Johnson",
        "--tamanhos", "30", "60", "100", "150",
        "--repeticoes", "30",
        "--aquecimentos", "3",
        "--pular-testes"
      ]

  testes:
    build:
      context: .
      dockerfile: Dockerfile
    image: projeto-menor-caminho:latest
    command: ["python", "main.py", "--somente-testes"]

  visualizacao:
    image: nginx:alpine
    container_name: visualizacao-algoritmos
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./grafico.js:/usr/share/nginx/html/grafico.js:ro
      - ./resultados:/usr/share/nginx/html/resultados:ro
    restart: unless-stopped
