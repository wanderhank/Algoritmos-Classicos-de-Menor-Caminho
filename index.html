<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desempenho dos algoritmos de menor caminho</title>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    header, main {
      width: min(1400px, 100%);
      margin-inline: auto;
    }

    h1 { margin: 0 0 8px; }

    .descricao {
      margin: 0 0 20px;
      color: #5f6368;
    }

    .controles {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding: 14px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
    }

    select, button {
      padding: 9px 12px;
      border: 1px solid #c4c7c5;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #f1f3f4; }

    #status {
      margin-left: auto;
      color: #5f6368;
      font-size: 14px;
    }

    #status.erro {
      color: #b3261e;
      font-weight: 700;
    }

    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .painel {
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
    }

    .grafico {
      width: 100%;
      height: 520px;
    }

    @media (max-width: 760px) {
      body { padding: 12px; }
      #status { width: 100%; margin-left: 0; }
      .grafico { height: 440px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Desempenho dos algoritmos de menor caminho</h1>
  <p class="descricao">
    Comparação por quantidade de vértices, mantendo a classe de densidade controlada.
    A quantidade de arestas aparece como informação complementar.
  </p>

  <div class="controles">
    <label for="filtro-densidade"><strong>Densidade:</strong></label>
    <select id="filtro-densidade" aria-label="Selecionar densidade"></select>

    <button id="botao-atualizar" type="button">Atualizar agora</button>
    <span id="status">Aguardando carregamento...</span>
  </div>
</header>

<main>
  <section class="painel">
    <div id="grafico-tempo" class="grafico"></div>
  </section>

  <section class="painel">
    <div id="grafico-memoria" class="grafico"></div>
  </section>
</main>

<script src="./grafico.js"></script>
</body>
</html>
